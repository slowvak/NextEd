services:

  # ── AI inference server (SigmaServer) ────────────────────────────────────────
  sigmaserver:
    build:
      context: ../SigmaServer
      dockerfile: Dockerfile
    ports:
      # Loopback only: the AI server accepts full NIfTI volumes.
      - "127.0.0.1:8050:8050"
    environment:
      # Shared with sigma-server below; set SIGMASERVER_API_KEY on the host.
      SIGMASERVER_API_KEY: ${SIGMASERVER_API_KEY:?set SIGMASERVER_API_KEY (e.g. export SIGMASERVER_API_KEY=$(uuidgen))}
    volumes:
      # Mount model weights from the host. Each model lives at:
      #   ../SigmaServer/models/<model-id>/<weights-file>
      - ../SigmaServer/models:/app/models:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8050/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Image / volume server (Sigma backend) ────────────────────────────────────
  sigma-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      # Loopback only. This server hands out complete DICOM studies via
      # /api/v1/wado-rs; it must not be reachable from the network.
      - "127.0.0.1:8060:8060"
    volumes:
      # Mirrored at its own absolute host path, not remapped to /data. The UI's
      # "Select Image Folder" saves whatever path you type straight into
      # config.source_directory and the server then opens it directly, so a
      # container-only /data path can't satisfy a host path like
      # /Users/you/Desktop/DICOM. Same convention as the ewocs5 backend mounts.
      - ${DATA_DIR:-${HOME}/Desktop}:${DATA_DIR:-${HOME}/Desktop}
      # config.json must live outside the image: the UI writes source_directory
      # through PUT /api/v1/config, and baked into the image that choice is lost
      # on every restart (and a stale build-time path wins until the next
      # rebuild). The entrypoint's ai.server patch lands in this file too.
      - ./config.json:/app/config.json
    environment:
      # Tells the entrypoint to point config.json at the AI container
      AI_SERVER_URL: "http://sigmaserver:8050"
      SIGMASERVER_API_KEY: ${SIGMASERVER_API_KEY}
      # Verifies the ewocs5 handoff token before serving any study. start.sh
      # mirrors this from ewocs5/.env so the two cannot drift apart.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (start.sh mirrors it from ewocs5/.env)}
      # Inside a container uvicorn must bind all interfaces or the port mapping
      # above cannot reach it. Exposure is constrained by that mapping, not here.
      SIGMA_BIND_HOST: "0.0.0.0"
      # Confines /api/v1/config/list-dir to the directory mounted above — the
      # picker walks server-side now, so without this it could list the whole
      # container filesystem.
      BROWSE_ROOT: ${DATA_DIR:-${HOME}/Desktop}
    depends_on:
      sigmaserver:
        condition: service_healthy
    restart: unless-stopped

  # ── Web client (Vite build served by nginx) ──────────────────────────────────
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    ports:
      - "127.0.0.1:5275:80"
    depends_on:
      - sigma-server
    restart: unless-stopped

networks:
  default:
    name: sigma-net
